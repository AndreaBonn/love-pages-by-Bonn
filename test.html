<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>LovePage Tests</title>
  <style>
    body { font-family: monospace; margin: 2rem; background: #1a1a2e; color: #e0e0e0; }
    .pass { color: #22c55e; }
    .fail { color: #ef4444; font-weight: bold; }
    .suite { color: #a78bfa; margin-top: 1.5rem; font-size: 1.1rem; }
    .summary { margin-top: 2rem; padding: 1rem; border-top: 1px solid #333; font-size: 1.2rem; }
  </style>
</head>
<body>
  <h1>LovePage Test Suite</h1>
  <div id="results"></div>

  <!-- Provide a minimal config so engine.js doesn't error on DOM operations -->
  <div id="lp-header"></div>
  <div id="lp-emoji"></div>
  <h1 id="lp-question"></h1>
  <button id="lp-btn-yes"></button>
  <button id="lp-btn-no"></button>
  <div id="lp-modal" class="lp-overlay">
    <div class="lp-modal">
      <h2 id="lp-modal-title"></h2>
      <img id="lp-modal-photo" src="">
      <div id="lp-modal-photo-fallback" style="display:none"></div>
      <p id="lp-modal-message"></p>
      <button id="lp-modal-close"></button>
    </div>
  </div>
  <div id="lp-particles"></div>
  <footer id="lp-footer"></footer>
  <meta property="og:title" id="lp-og-title" content="">
  <meta property="og:description" id="lp-og-description" content="">
  <meta property="og:image" id="lp-og-image" content="">

  <script src="config.js"></script>
  <script src="engine.js"></script>
  <script>
    (function () {
      var results = document.getElementById("results");
      var passed = 0;
      var failed = 0;
      var currentSuite = "";

      function suite(name) {
        currentSuite = name;
        var el = document.createElement("div");
        el.className = "suite";
        el.textContent = name;
        results.appendChild(el);
      }

      function assert(description, condition) {
        var el = document.createElement("div");
        if (condition) {
          el.className = "pass";
          el.textContent = "  PASS  " + description;
          passed++;
        } else {
          el.className = "fail";
          el.textContent = "  FAIL  " + description;
          failed++;
        }
        results.appendChild(el);
      }

      function assertEqual(description, actual, expected) {
        var match = actual === expected;
        var el = document.createElement("div");
        if (match) {
          el.className = "pass";
          el.textContent = "  PASS  " + description;
          passed++;
        } else {
          el.className = "fail";
          el.textContent = "  FAIL  " + description +
            " (expected: " + JSON.stringify(expected) +
            ", got: " + JSON.stringify(actual) + ")";
          failed++;
        }
        results.appendChild(el);
      }

      var I = window.__LOVEPAGE_INTERNALS__;

      // ── escapeHTML ─────────────────────────────────────────────

      suite("escapeHTML");

      assertEqual(
        "escapes angle brackets",
        I.escapeHTML("<div>hello</div>"),
        "&lt;div&gt;hello&lt;/div&gt;"
      );

      assertEqual(
        "escapes ampersand",
        I.escapeHTML("Tom & Jerry"),
        "Tom &amp; Jerry"
      );

      assertEqual(
        "preserves double quotes in text context",
        I.escapeHTML('He said "hello"'),
        'He said "hello"'
      );

      assertEqual(
        "passes through plain text unchanged",
        I.escapeHTML("Marco"),
        "Marco"
      );

      assertEqual(
        "handles empty string",
        I.escapeHTML(""),
        ""
      );

      assertEqual(
        "handles unicode characters",
        I.escapeHTML("Caf\u00e9 & R\u00e9sum\u00e9"),
        "Caf\u00e9 &amp; R\u00e9sum\u00e9"
      );

      // ── isDateInRange ──────────────────────────────────────────

      suite("isDateInRange");

      // Valentine: Feb 10-14
      var valentineRange = { start: [2, 10], end: [2, 14] };

      assert(
        "Feb 12 is within Valentine range",
        I.isDateInRange(new Date(2026, 1, 12), valentineRange)
      );

      assert(
        "Feb 10 is within Valentine range (start boundary)",
        I.isDateInRange(new Date(2026, 1, 10), valentineRange)
      );

      assert(
        "Feb 14 is within Valentine range (end boundary)",
        I.isDateInRange(new Date(2026, 1, 14), valentineRange)
      );

      assert(
        "Feb 9 is outside Valentine range",
        !I.isDateInRange(new Date(2026, 1, 9), valentineRange)
      );

      assert(
        "Feb 15 is outside Valentine range",
        !I.isDateInRange(new Date(2026, 1, 15), valentineRange)
      );

      assert(
        "Mar 1 is outside Valentine range",
        !I.isDateInRange(new Date(2026, 2, 1), valentineRange)
      );

      // Year-crossing range: Dec 28 - Jan 2
      var newYearRange = { start: [12, 28], end: [1, 2] };

      assert(
        "Dec 28 is within New Year range (start boundary)",
        I.isDateInRange(new Date(2026, 11, 28), newYearRange)
      );

      assert(
        "Dec 31 is within New Year range",
        I.isDateInRange(new Date(2026, 11, 31), newYearRange)
      );

      assert(
        "Jan 1 is within New Year range (year crossing)",
        I.isDateInRange(new Date(2027, 0, 1), newYearRange)
      );

      assert(
        "Jan 2 is within New Year range (end boundary)",
        I.isDateInRange(new Date(2027, 0, 2), newYearRange)
      );

      assert(
        "Jan 3 is outside New Year range",
        !I.isDateInRange(new Date(2027, 0, 3), newYearRange)
      );

      assert(
        "Dec 27 is outside New Year range",
        !I.isDateInRange(new Date(2026, 11, 27), newYearRange)
      );

      // Spring: Mar 20 - Apr 10 (cross-month, same year)
      var springRange = { start: [3, 20], end: [4, 10] };

      assert(
        "Mar 25 is within Spring range",
        I.isDateInRange(new Date(2026, 2, 25), springRange)
      );

      assert(
        "Apr 5 is within Spring range (cross-month)",
        I.isDateInRange(new Date(2026, 3, 5), springRange)
      );

      assert(
        "Apr 11 is outside Spring range",
        !I.isDateInRange(new Date(2026, 3, 11), springRange)
      );

      // ── detectEvent ────────────────────────────────────────────

      suite("detectEvent");

      assertEqual(
        "forceEvent='valentine' returns valentine",
        I.detectEvent({ forceEvent: "valentine", language: "en" }).id,
        "valentine"
      );

      assertEqual(
        "forceEvent='generic' returns generic",
        I.detectEvent({ forceEvent: "generic", language: "en" }).id,
        "generic"
      );

      assertEqual(
        "forceEvent='nonexistent' falls back to auto-detection",
        I.detectEvent({ forceEvent: "nonexistent", language: "en" }).id !== undefined,
        true
      );

      assertEqual(
        "forceEvent=null uses auto-detection",
        I.detectEvent({ forceEvent: null, language: "en" }).id !== undefined,
        true
      );

      // ── getConfig ──────────────────────────────────────────────

      suite("getConfig");

      var config = I.getConfig();

      assertEqual(
        "reads yourName from config.js",
        config.yourName,
        "Romeo"
      );

      assertEqual(
        "reads partnerName from config.js",
        config.partnerName,
        "Giulietta"
      );

      assertEqual(
        "reads language from config.js",
        config.language,
        "en"
      );

      assert(
        "showFooter defaults to true",
        config.showFooter === true
      );

      // Test fallback: temporarily break config
      var originalConfig = window.LOVEPAGE_CONFIG;
      window.LOVEPAGE_CONFIG = null;
      var fallbackConfig = I.getConfig();

      assertEqual(
        "null config falls back to default yourName",
        fallbackConfig.yourName,
        "Someone"
      );

      assertEqual(
        "null config falls back to default language",
        fallbackConfig.language,
        "en"
      );

      // Test invalid language fallback
      window.LOVEPAGE_CONFIG = { language: "xx" };
      var invalidLangConfig = I.getConfig();

      assertEqual(
        "unsupported language falls back to 'en'",
        invalidLangConfig.language,
        "en"
      );

      // Restore original config
      window.LOVEPAGE_CONFIG = originalConfig;

      // ── EVENTS data integrity ──────────────────────────────────

      suite("EVENTS data integrity");

      assertEqual(
        "9 events defined (8 seasonal + generic)",
        I.EVENTS.length + 1,
        9
      );

      I.EVENTS.forEach(function (event) {
        assert(
          event.id + " has EN question",
          typeof event.question.en === "string" && event.question.en.length > 0
        );

        assert(
          event.id + " has IT question",
          typeof event.question.it === "string" && event.question.it.length > 0
        );

        assert(
          event.id + " has valid dateRange",
          event.dateRange &&
          Array.isArray(event.dateRange.start) &&
          Array.isArray(event.dateRange.end) &&
          event.dateRange.start.length === 2 &&
          event.dateRange.end.length === 2
        );

        assert(
          event.id + " has theme with all required colors",
          event.theme.primary && event.theme.secondary &&
          event.theme.background && event.theme.accent &&
          event.theme.text && event.theme.textLight
        );

        assert(
          event.id + " has particles type",
          typeof event.particles === "string"
        );
      });

      assert(
        "generic event has EN question",
        typeof I.GENERIC_EVENT.question.en === "string"
      );

      assert(
        "generic event has IT question",
        typeof I.GENERIC_EVENT.question.it === "string"
      );

      assert(
        "generic event has theme",
        I.GENERIC_EVENT.theme.primary !== undefined
      );

      // ── TRANSLATIONS completeness ──────────────────────────────

      suite("TRANSLATIONS completeness");

      var enKeys = Object.keys(I.TRANSLATIONS.en);
      var itKeys = Object.keys(I.TRANSLATIONS.it);

      assertEqual(
        "EN and IT have same number of keys",
        enKeys.length,
        itKeys.length
      );

      enKeys.forEach(function (key) {
        assert(
          "IT has translation for '" + key + "'",
          I.TRANSLATIONS.it[key] !== undefined
        );
      });

      // ── THEME_OVERRIDES ────────────────────────────────────────

      suite("THEME_OVERRIDES");

      ["dark", "light", "pastel"].forEach(function (name) {
        assert(
          name + " override exists",
          I.THEME_OVERRIDES[name] !== undefined
        );

        assert(
          name + " has background",
          typeof I.THEME_OVERRIDES[name].background === "string"
        );

        assert(
          name + " has text",
          typeof I.THEME_OVERRIDES[name].text === "string"
        );
      });

      // ── t() i18n helper ─────────────────────────────────────────

      suite("t() i18n helper");

      assertEqual(
        "returns EN translation for known key",
        I.t("yesButton", "en"),
        "Yes!"
      );

      assertEqual(
        "returns IT translation for known key",
        I.t("yesButton", "it"),
        "Sì!"
      );

      assertEqual(
        "replaces placeholder with value",
        I.t("popupTitle", "en", { partnerName: "Alice" }),
        "Yes, Alice!"
      );

      assertEqual(
        "replaces placeholder in IT",
        I.t("popupTitle", "it", { partnerName: "Marco" }),
        "Sì, Marco!"
      );

      assertEqual(
        "returns key itself if not found in any language",
        I.t("nonExistentKey", "en"),
        "nonExistentKey"
      );

      assertEqual(
        "falls back to EN for unsupported language",
        I.t("yesButton", "fr"),
        "Yes!"
      );

      assertEqual(
        "works without replacements param",
        I.t("noButton", "en", null),
        "No"
      );

      assertEqual(
        "ignores extra replacement keys not in template",
        I.t("noButton", "en", { unused: "value" }),
        "No"
      );

      // ── getParticleEmojis ────────────────────────────────────────

      suite("getParticleEmojis");

      assertEqual(
        "returns hearts array for 'hearts' type",
        I.getParticleEmojis("hearts").length,
        I.PARTICLE_MAP.hearts.length
      );

      assert(
        "hearts contains ❤️",
        I.getParticleEmojis("hearts").indexOf("\u2764\uFE0F") !== -1
      );

      assert(
        "returns snowflakes array for 'snowflakes' type",
        I.getParticleEmojis("snowflakes") === I.PARTICLE_MAP.snowflakes
      );

      assert(
        "returns clovers array for 'clovers' type",
        I.getParticleEmojis("clovers") === I.PARTICLE_MAP.clovers
      );

      assert(
        "falls back to hearts for unknown type",
        I.getParticleEmojis("unknown") === I.PARTICLE_MAP.hearts
      );

      assert(
        "falls back to hearts for undefined type",
        I.getParticleEmojis(undefined) === I.PARTICLE_MAP.hearts
      );

      assert(
        "falls back to hearts for null type",
        I.getParticleEmojis(null) === I.PARTICLE_MAP.hearts
      );

      // ── detectEvent (extended) ───────────────────────────────────

      suite("detectEvent (extended)");

      // Test each forceEvent value
      ["valentine", "patrick", "spring", "liberation", "summer",
       "halloween", "christmas", "newyear"].forEach(function (id) {
        assertEqual(
          "forceEvent='" + id + "' returns correct event",
          I.detectEvent({ forceEvent: id, language: "en" }).id,
          id
        );
      });

      // Test auto-detection with known dates
      // Save original Date and mock it
      var OriginalDate = Date;

      function mockDate(year, month, day) {
        var fixed = new OriginalDate(year, month, day);
        window.Date = function () {
          if (arguments.length === 0) return fixed;
          return new (Function.prototype.bind.apply(OriginalDate, [null].concat(Array.prototype.slice.call(arguments))))();
        };
        window.Date.prototype = OriginalDate.prototype;
        window.Date.now = function () { return fixed.getTime(); };
      }

      mockDate(2026, 1, 12); // Feb 12
      assertEqual(
        "auto-detects valentine on Feb 12",
        I.detectEvent({ forceEvent: null, language: "en" }).id,
        "valentine"
      );

      mockDate(2026, 9, 29); // Oct 29
      assertEqual(
        "auto-detects halloween on Oct 29",
        I.detectEvent({ forceEvent: null, language: "en" }).id,
        "halloween"
      );

      mockDate(2026, 11, 25); // Dec 25
      assertEqual(
        "auto-detects christmas on Dec 25",
        I.detectEvent({ forceEvent: null, language: "en" }).id,
        "christmas"
      );

      mockDate(2027, 0, 1); // Jan 1
      assertEqual(
        "auto-detects newyear on Jan 1",
        I.detectEvent({ forceEvent: null, language: "en" }).id,
        "newyear"
      );

      mockDate(2026, 6, 15); // Jul 15 — no event
      assertEqual(
        "auto-detects generic on Jul 15 (no seasonal event)",
        I.detectEvent({ forceEvent: null, language: "en" }).id,
        "generic"
      );

      mockDate(2026, 2, 15); // Mar 15 — St Patrick
      assertEqual(
        "auto-detects patrick on Mar 15",
        I.detectEvent({ forceEvent: null, language: "en" }).id,
        "patrick"
      );

      mockDate(2026, 5, 20); // Jun 20 — Summer
      assertEqual(
        "auto-detects summer on Jun 20",
        I.detectEvent({ forceEvent: null, language: "en" }).id,
        "summer"
      );

      // Restore original Date
      window.Date = OriginalDate;

      // ── getConfig (extended) ─────────────────────────────────────

      suite("getConfig (extended)");

      var origCfg = window.LOVEPAGE_CONFIG;

      // Partial config — only some fields
      window.LOVEPAGE_CONFIG = { yourName: "Alice" };
      var partial = I.getConfig();

      assertEqual(
        "partial config reads provided field",
        partial.yourName,
        "Alice"
      );

      assertEqual(
        "partial config uses default for missing partnerName",
        partial.partnerName,
        "You"
      );

      assertEqual(
        "partial config uses default for missing language",
        partial.language,
        "en"
      );

      assertEqual(
        "partial config uses default for missing successPhoto",
        partial.successPhoto,
        "assets/photos/example.jpg"
      );

      assertEqual(
        "partial config uses default for missing successMessage",
        partial.successMessage,
        "You are the best thing that ever happened to me"
      );

      assert(
        "partial config uses default showFooter=true",
        partial.showFooter === true
      );

      assertEqual(
        "partial config uses default forceEvent=null",
        partial.forceEvent,
        null
      );

      assertEqual(
        "partial config uses default customQuestion=null",
        partial.customQuestion,
        null
      );

      assertEqual(
        "partial config uses default theme=null",
        partial.theme,
        null
      );

      // Config with IT language
      window.LOVEPAGE_CONFIG = { language: "it" };
      assertEqual(
        "config with 'it' language is accepted",
        I.getConfig().language,
        "it"
      );

      // Config with explicit false for showFooter
      window.LOVEPAGE_CONFIG = { showFooter: false };
      assertEqual(
        "showFooter=false is preserved (not overridden by default)",
        I.getConfig().showFooter,
        false
      );

      // Empty object config
      window.LOVEPAGE_CONFIG = {};
      var emptyCfg = I.getConfig();
      assertEqual(
        "empty object config falls back to default yourName",
        emptyCfg.yourName,
        "Someone"
      );

      // Restore
      window.LOVEPAGE_CONFIG = origCfg;

      // ── isDateInRange (extended) ─────────────────────────────────

      suite("isDateInRange (extended)");

      // Single-day range
      var singleDay = { start: [5, 1], end: [5, 1] };

      assert(
        "May 1 is within single-day range [5,1]-[5,1]",
        I.isDateInRange(new Date(2026, 4, 1), singleDay)
      );

      assert(
        "May 2 is outside single-day range",
        !I.isDateInRange(new Date(2026, 4, 2), singleDay)
      );

      assert(
        "Apr 30 is outside single-day range",
        !I.isDateInRange(new Date(2026, 3, 30), singleDay)
      );

      // Year-crossing: mid-range date in January
      var xmasNewYear = { start: [12, 20], end: [1, 5] };

      assert(
        "Jan 3 is within Dec 20 - Jan 5 range",
        I.isDateInRange(new Date(2027, 0, 3), xmasNewYear)
      );

      assert(
        "Jan 6 is outside Dec 20 - Jan 5 range",
        !I.isDateInRange(new Date(2027, 0, 6), xmasNewYear)
      );

      assert(
        "Jun 15 is outside year-crossing range",
        !I.isDateInRange(new Date(2026, 5, 15), xmasNewYear)
      );

      // ── EVENTS no overlap ────────────────────────────────────────

      suite("EVENTS no overlap");

      // Check that no two events overlap in date ranges (excluding year-crossing edge)
      var noOverlap = true;
      var overlapPair = "";
      for (var i = 0; i < I.EVENTS.length && noOverlap; i++) {
        for (var j = i + 1; j < I.EVENTS.length && noOverlap; j++) {
          // Test representative dates in event i's range
          var a = I.EVENTS[i];
          var b = I.EVENTS[j];
          var startM = a.dateRange.start[0];
          var startD = a.dateRange.start[1];
          var endM = a.dateRange.end[0];
          var endD = a.dateRange.end[1];

          // Check if event b's start falls within event a's range
          var bStart = new Date(2026, b.dateRange.start[0] - 1, b.dateRange.start[1]);
          var bEnd = new Date(2026, b.dateRange.end[0] - 1, b.dateRange.end[1]);
          if (I.isDateInRange(bStart, a.dateRange) || I.isDateInRange(bEnd, a.dateRange)) {
            noOverlap = false;
            overlapPair = a.id + " / " + b.id;
          }
        }
      }

      assert(
        "no two events have overlapping date ranges" + (overlapPair ? " (overlap: " + overlapPair + ")" : ""),
        noOverlap
      );

      // ── GENERIC_EVENT completeness ───────────────────────────────

      suite("GENERIC_EVENT completeness");

      assertEqual(
        "generic event id is 'generic'",
        I.GENERIC_EVENT.id,
        "generic"
      );

      assert(
        "generic event has emoji",
        typeof I.GENERIC_EVENT.emoji === "string" && I.GENERIC_EVENT.emoji.length > 0
      );

      assert(
        "generic event has particles type",
        typeof I.GENERIC_EVENT.particles === "string"
      );

      assert(
        "generic event has label.en",
        typeof I.GENERIC_EVENT.label.en === "string"
      );

      assert(
        "generic event has label.it",
        typeof I.GENERIC_EVENT.label.it === "string"
      );

      assert(
        "generic event has complete theme",
        I.GENERIC_EVENT.theme.primary && I.GENERIC_EVENT.theme.secondary &&
        I.GENERIC_EVENT.theme.background && I.GENERIC_EVENT.theme.accent &&
        I.GENERIC_EVENT.theme.text && I.GENERIC_EVENT.theme.textLight
      );

      // ── EVENTS all particle types are valid ──────────────────────

      suite("EVENTS particle types");

      I.EVENTS.forEach(function (event) {
        assert(
          event.id + " particles type '" + event.particles + "' exists in PARTICLE_MAP",
          I.PARTICLE_MAP[event.particles] !== undefined
        );
      });

      assert(
        "generic particles type '" + I.GENERIC_EVENT.particles + "' exists in PARTICLE_MAP",
        I.PARTICLE_MAP[I.GENERIC_EVENT.particles] !== undefined
      );

      // ── EVENTS emoji presence ────────────────────────────────────

      suite("EVENTS emoji & label");

      I.EVENTS.forEach(function (event) {
        assert(
          event.id + " has non-empty emoji",
          typeof event.emoji === "string" && event.emoji.length > 0
        );

        assert(
          event.id + " has label.en",
          typeof event.label.en === "string" && event.label.en.length > 0
        );

        assert(
          event.id + " has label.it",
          typeof event.label.it === "string" && event.label.it.length > 0
        );
      });

      // ── Summary ────────────────────────────────────────────────

      var summary = document.createElement("div");
      summary.className = "summary";
      if (failed === 0) {
        summary.innerHTML = '<span class="pass">ALL ' + passed + ' TESTS PASSED</span>';
      } else {
        summary.innerHTML =
          '<span class="fail">' + failed + ' FAILED</span> / ' +
          '<span class="pass">' + passed + ' PASSED</span> / ' +
          (passed + failed) + ' TOTAL';
      }
      results.appendChild(summary);

      // Set title for Playwright/CI parsing
      document.title = failed === 0
        ? "PASS (" + passed + " tests)"
        : "FAIL (" + failed + " failures)";
    })();
  </script>
</body>
</html>
