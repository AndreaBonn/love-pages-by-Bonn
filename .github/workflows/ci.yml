name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install chromium --with-deps

      - name: Run tests
        run: |
          npx serve . -l 3000 &
          sleep 2
          node scripts/run-tests.js

      - name: Generate test badge
        if: always()
        run: |
          node -e "
          const fs = require('fs');
          let badge;
          if (!fs.existsSync('test-results.json')) {
            badge = { schemaVersion: 1, label: 'tests', message: 'error', color: 'red' };
          } else {
            const { passed, failed, total } = JSON.parse(fs.readFileSync('test-results.json', 'utf8'));
            badge = {
              schemaVersion: 1,
              label: 'tests',
              message: failed > 0 ? passed + '/' + total + ' passed' : passed + ' passed',
              color: failed > 0 ? 'red' : 'brightgreen'
            };
          }
          fs.writeFileSync('badges/test-badge.json', JSON.stringify(badge));
          console.log('Badge:', JSON.stringify(badge));
          "

      - name: Commit badges
        if: always() && github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add badges/test-badge.json
          git diff --cached --quiet || git commit -m "ci: update badges [skip ci]"
          git push
